<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audiofax</title>
<style>
:root{--bg:#eceef3;--fg:#1c2030;--dim:#5d6478;--line:#c9cdd8;--acc:#2f5bd8;--panel:#f7f8fb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2030;--fg:#e6e8f0;--dim:#9097ad;--line:#343a50;--acc:#8fb0ff;--panel:#232840;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c2030;--fg:#e6e8f0;--dim:#9097ad;--line:#343a50;--acc:#8fb0ff;--panel:#232840;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Iowan Old Style","Palatino Linotype",Georgia,serif}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:30px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
p.lead{margin:0 0 26px;color:var(--dim)}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:18px}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
canvas{display:block;width:100%;aspect-ratio:4/3;background:#000;image-rendering:pixelated;border-radius:3px}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
button,label.btn{font:inherit;background:var(--acc);color:var(--bg);border:0;border-radius:4px;padding:8px 14px;cursor:pointer}
button.ghost,label.btn{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.st{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--dim);min-height:1.4em;margin-top:10px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
#prev{width:128px;aspect-ratio:4/3}
.hint{font-size:14px;color:var(--dim);margin:0}
</style>
</head>
<body>
<main>
<h1>Audiofax</h1>
<p class="lead">Obraz zamieniony na dźwięk (analogowy OFDM), wysłany z głośnika i odebrany mikrofonem drugiego urządzenia.</p>

<section>
<h2>Odbiornik</h2>
<canvas id="screen" width="256" height="192"></canvas>
<div class="row"><button id="listen">Włącz nasłuch</button></div>
<div class="st" id="status">Nasłuch wyłączony</div>
</section>

<section>
<h2>Nadajnik</h2>
<div class="row" style="margin-top:0">
<canvas id="prev" width="64" height="48"></canvas>
<div>
<label class="btn">Wybierz obraz<input type="file" id="file" accept="image/*"></label>
</div>
</div>
<div class="row"><button id="send" disabled>Nadaj</button><span class="st" id="txst" style="margin:0"></span></div>
<div class="bar"><i id="prog"></i></div>
</section>

<p class="hint">Ustaw głośność na ok. 70%, urządzenia 0,5–1 m od siebie, w ciszy. Test na jednym urządzeniu też działa: nasłuch usłyszy własny głośnik.</p>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
// ---- parametry: analogowy OFDM ----
const FS=48000,N=1024,CP=256,SYM=N+CP,K0=17,K1=84,CH=4096,STRIDE=128;
const C={W:160,H:120}, NPIX=C.W*C.H;
const bins=[];for(let k=K0;k<=K1;k++)bins.push(k);
const isP=k=>(k-K0)%4===0, pil=k=>((k*7+3)%5<2)?-1:1;
const PB=bins.filter(isP), DB=bins.filter(k=>!isP(k)), PER=DB.length*2, NSYM=Math.ceil(NPIX/PER);
const cl=x=>Math.max(0,Math.min(1,x));
let actx=null;
function ctx(){ if(!actx){ try{actx=new AudioContext({sampleRate:FS});}catch(e){actx=new (window.AudioContext||window.webkitAudioContext)();} } if(actx.state==="suspended")actx.resume(); return actx; }

function fft(re,im,inv){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){ let b=n>>1; for(;j&b;b>>=1)j^=b; j^=b; if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;} }
  for(let len=2;len<=n;len<<=1){
    const a=(inv?2:-2)*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a),h=len>>1;
    for(let i=0;i<n;i+=len){ let cr=1,ci=0;
      for(let k=0;k<h;k++){ const u=i+k,v=u+h,tr=re[v]*cr-im[v]*ci,ti=re[v]*ci+im[v]*cr;
        re[v]=re[u]-tr;im[v]=im[u]-ti;re[u]+=tr;im[u]+=ti; const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t; } } }
  if(inv)for(let i=0;i<n;i++){re[i]/=n;im[i]/=n;}
}
// chirp 800→4000 Hz z oknem Hanna: preambuła synchronizacji
const chirp=new Float32Array(CH);
for(let i=0;i<CH;i++){ const t=i/FS,T=CH/FS; chirp[i]=Math.sin(2*Math.PI*(800*t+3200*t*t/(2*T)))*(0.5-0.5*Math.cos(2*Math.PI*i/CH)); }

// ---- ekran odbiornika ----
const scr=$("screen"),sg=scr.getContext("2d");
const small=document.createElement("canvas");small.width=C.W;small.height=C.H;
const smg=small.getContext("2d"), vals=new Float32Array(NPIX), noise=sg.createImageData(scr.width,scr.height);
let lines=0,receiving=false,showUntil=0;
function renderSmall(){
  const m=lines*C.W; if(!m)return;
  const s=Array.from(vals.subarray(0,m)).sort((a,b)=>a-b), lo=s[Math.floor(m*.02)], hi=s[Math.min(m-1,Math.floor(m*.98))], sp=Math.max(hi-lo,.05);
  const im=smg.createImageData(C.W,C.H);
  for(let i=0;i<m;i++){const g=cl((vals[i]-lo)/sp)*255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=g;im.data[i*4+3]=255;}
  smg.putImageData(im,0,0);
}
function frame(){
  const d=noise.data;
  for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=(Math.random()*230)|0;d[i+3]=255;}
  sg.putImageData(noise,0,0);
  if(lines>0&&(receiving||performance.now()<showUntil)){
    sg.imageSmoothingEnabled=false; const dh=lines*scr.height/C.H;
    sg.drawImage(small,0,0,C.W,lines,0,0,scr.width,dh);
    if(receiving){sg.fillStyle="rgba(255,255,255,.55)";sg.fillRect(0,dh,scr.width,2);}
  } else if(lines>0)lines=0;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- odbiór: korelacja z chirpem + OFDM z equalizacją pilotową ----
const buf=new Float32Array(FS*30);
let n=0,d=0,st="IDLE",P0=0,sym=0,bm=0,bd=0,live=0,listening=false;
function ncorr(d){let p=0,e1=0,e2=0;for(let i=0;i<CH;i++){const a=buf[d+i],b=buf[d+CH+i];p+=a*b;e1+=a*a;e2+=b*b;}
  return e1<CH*1e-6?0:p/Math.sqrt(e1*e2);}
function lock(c){ // dopasowanie do wzorca chirpa: dokładny początek (±STRIDE)
  let best=-1,bo=0,ew=0;
  for(let o=c-STRIDE;o<=c+STRIDE;o++){ if(o<0)continue; let s=0,e=0;
    for(let i=0;i<CH;i++){const a=buf[o+i]+buf[o+CH+i];s+=a*chirp[i];e+=a*a;}
    if(s>best){best=s;bo=o;ew=e;} }
  let ec=0;for(let i=0;i<CH;i++)ec+=chirp[i]*chirp[i];
  if(best/Math.sqrt(ew*ec+1e-12)<.5)return false;
  P0=bo+2*CH;sym=0;st="RX";receiving=true;lines=0;return true;
}
function scan(){
  for(;d+2*CH<=n;d+=STRIDE){
    const m=ncorr(d);live=m;
    if(m>.4&&m>bm){bm=m;bd=d;}
    else if(bm>0&&m<bm*.7){ if(lock(bd))return; bm=0; }
  }
  if(n>FS*6){const keep=3*CH,sh=n-keep;buf.copyWithin(0,sh,n);n=keep;d=Math.max(0,d-sh);bd-=sh;if(bd<0)bm=0;}
}
const rr=new Float64Array(N),ri=new Float64Array(N);
function decodeSym(s){
  const o=P0+s*SYM+CP-24;
  for(let i=0;i<N;i++){rr[i]=buf[o+i];ri[i]=0;} fft(rr,ri,false);
  const hr=PB.map(k=>rr[k]*pil(k)),hi=PB.map(k=>ri[k]*pil(k));
  DB.forEach((k,i)=>{
    const j=Math.floor((k-K0)/4),j2=Math.min(j+1,PB.length-1),t=((k-K0)%4)/4;
    const Hr=hr[j]*(1-t)+hr[j2]*t,Hi=hi[j]*(1-t)+hi[j2]*t,m=Hr*Hr+Hi*Hi+1e-12;
    const zr=(rr[k]*Hr+ri[k]*Hi)/m,zi=(ri[k]*Hr-rr[k]*Hi)/m,p=s*PER+2*i;
    if(p<NPIX)vals[p]=cl(zr/2+.5); if(p+1<NPIX)vals[p+1]=cl(zi/2+.5);
  });
}
function resetIdle(){st="IDLE";n=0;d=0;bm=0;sym=0;receiving=false;}
function rx(){
  while(sym<NSYM){
    if(P0+sym*SYM+CP-24+N>n)return;
    decodeSym(sym++); lines=Math.min(C.H,Math.floor(sym*PER/C.W)); if(sym%6===0)renderSmall();
  }
  lines=C.H;renderSmall();showUntil=performance.now()+25000;resetIdle();
}
async function startListen(){
  try{
    const a=ctx();
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    const src=a.createMediaStreamSource(stream),proc=a.createScriptProcessor(4096,1,1),mute=a.createGain();mute.gain.value=0;
    proc.onaudioprocess=e=>{
      const x=e.inputBuffer.getChannelData(0);
      if(n+x.length>buf.length)resetIdle();
      buf.set(x,n);n+=x.length; st==="IDLE"?scan():rx();
    };
    src.connect(proc);proc.connect(mute);mute.connect(a.destination);
    listening=true;$("listen").disabled=true;$("listen").textContent="Nasłuch włączony";
    if(a.sampleRate!==FS)$("status").textContent="Uwaga: przeglądarka nie dała 48 kHz ("+a.sampleRate+"), odbiór może zawieść.";
  }catch(err){$("status").textContent="Brak dostępu do mikrofonu. Zezwól na mikrofon lub otwórz stronę przez https.";}
}
$("listen").onclick=startListen;
setInterval(()=>{ if(!listening)return;
  if(actx.sampleRate!==FS&&st==="IDLE"&&!live)return;
  $("status").textContent=st==="IDLE"?"Cisza, tylko szum | korelacja z preambułą "+live.toFixed(2):"Odbiór: "+Math.round(100*sym/NSYM)+"%";
},200);

// ---- nadawanie ----
const pv=$("prev"),pg=pv.getContext("2d");pv.width=C.W;pv.height=C.H;
let txVals=null,playing=null;
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const r=Math.max(C.W/img.width,C.H/img.height),w=img.width*r,h=img.height*r;
    pg.drawImage(img,(C.W-w)/2,(C.H-h)/2,w,h);
    const im=pg.getImageData(0,0,C.W,C.H),g=new Float32Array(NPIX);
    for(let i=0;i<NPIX;i++)g[i]=(.299*im.data[i*4]+.587*im.data[i*4+1]+.114*im.data[i*4+2])/255;
    const s=Array.from(g).sort((a,b)=>a-b),lo=s[Math.floor(NPIX*.02)],sp=Math.max(s[Math.floor(NPIX*.98)]-lo,.05);
    for(let i=0;i<NPIX;i++){g[i]=cl((g[i]-lo)/sp);im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=g[i]*255;im.data[i*4+3]=255;}
    pg.putImageData(im,0,0);txVals=g;$("send").disabled=false;URL.revokeObjectURL(img.src);
  };img.src=URL.createObjectURL(f);
};
function synth(){
  const pay=new Float32Array(NSYM*SYM),re=new Float64Array(N),im=new Float64Array(N);
  for(let s=0;s<NSYM;s++){
    re.fill(0);im.fill(0);
    for(const k of PB){re[k]=pil(k);re[N-k]=pil(k);}
    DB.forEach((k,i)=>{const p=s*PER+2*i,a=p<NPIX?(txVals[p]-.5)*2:0,b=p+1<NPIX?(txVals[p+1]-.5)*2:0;re[k]=a;im[k]=b;re[N-k]=a;im[N-k]=-b;});
    fft(re,im,true);
    const o=s*SYM;for(let i=0;i<N;i++)pay[o+CP+i]=re[i];for(let i=0;i<CP;i++)pay[o+i]=re[N-CP+i];
  }
  let e=0;for(let i=0;i<pay.length;i++)e+=pay[i]*pay[i];
  const lim=3.5*Math.sqrt(e/pay.length);let mx=0;
  for(let i=0;i<pay.length;i++){pay[i]=Math.max(-lim,Math.min(lim,pay[i]));mx=Math.max(mx,Math.abs(pay[i]));}
  const out=new Float32Array(Math.round(.3*FS)+2*CH+pay.length+Math.round(.3*FS)),o0=Math.round(.3*FS);
  for(let i=0;i<CH;i++){out[o0+i]=chirp[i]*.9;out[o0+CH+i]=chirp[i]*.9;}
  for(let i=0;i<pay.length;i++)out[o0+2*CH+i]=pay[i]/mx*.85;
  return out;
}
$("send").onclick=()=>{
  if(playing){playing.stop();return;}
  const a=ctx(),data=synth(),ab=a.createBuffer(1,data.length,FS);ab.copyToChannel(data,0);
  const src=a.createBufferSource();src.buffer=ab;src.connect(a.destination);
  const t0=a.currentTime+.1,dur=ab.duration;src.start(t0);playing=src;
  $("send").textContent="Zatrzymaj";$("file").disabled=true;
  const iv=setInterval(()=>{const f=cl((a.currentTime-t0)/dur);$("prog").style.width=(f*100)+"%";$("txst").textContent="Nadawanie: "+(f*dur).toFixed(1)+" / "+dur.toFixed(1)+" s";},100);
  src.onended=()=>{clearInterval(iv);playing=null;$("send").textContent="Nadaj";$("file").disabled=false;$("prog").style.width="0";$("txst").textContent="Gotowe";};
};
</script>
</body>
</html>
